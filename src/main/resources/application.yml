spring:
  datasource:
    url: jdbc:mysql://localhost:3306/musichub?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: /Vasa03/
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 60MB
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

session:
    store-type: none

logging:
  level:
    org.springframework.security: DEBUG
server:
  port: 8080

