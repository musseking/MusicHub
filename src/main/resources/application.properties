# =============================================
# DATABASE CONFIGURATION
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/musichub
spring.datasource.username=Vasa
spring.datasource.password=/Vasa03/
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE CONFIGURATION
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =============================================
# JSP VIEW CONFIGURATION
# =============================================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# =============================================
# SERVER CONFIGURATION
# =============================================
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=30m
server.servlet.session.persistent=true

# =============================================
# RESOURCE HANDLING (CACHING DISABLED FOR DEVELOPMENT)
# =============================================
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# =============================================
# ENCODING CONFIGURATION
# =============================================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =============================================
# LOGGING CONFIGURATION
# =============================================
logging.level.org.springframework.security=DEBUG
logging.level.com.music.hub=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.apache.tomcat=INFO

# =============================================
# SPRING MVC CONFIGURATION
# =============================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.mvc.static-path-pattern=/**

# =============================================
# DEVELOPMENT-SPECIFIC SETTINGS
# =============================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.jpa.defer-datasource-initialization=true

# =============================================
# FILE UPLOAD CONFIGURATION
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
spring.servlet.multipart.file-size-threshold=2KB

# =============================================
# TOMCAT/JSP SPECIFIC SETTINGS
# =============================================
server.tomcat.uri-encoding=UTF-8
server.tomcat.background-processor-delay=30
server.servlet.jsp.init-parameters.development=true